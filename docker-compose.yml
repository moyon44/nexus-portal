# The project name must stay "portail": the backend recognises its own
# containers by it and never updates or prunes them (it would stop itself).
name: portail

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-portal-db
    environment:
      POSTGRES_USER: portail
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: portail_db
    ports:
      - "5011:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portail"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-portal-backend
    ports:
      - "5010:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: portail
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: portail_db
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      # Web search in Ctrl K (optional): a SearXNG with JSON output enabled.
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ./backend/src:/app/src
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # To reach a SearXNG running in another compose project, join its network:
    # networks:
    #   - default
    #   - searxng-net

  nginx:
    image: nginx:alpine
    container_name: nexus-portal-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nexus-portal
      - backend
    restart: unless-stopped

  nexus-portal:
    build: .
    container_name: nexus-portal
    ports:
      - "2443:3000"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://backend:5000
      # Host names the dev server answers to besides localhost (e.g. .example.com).
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local

